<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestly | Cadastro</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/form.css">
</head>
<body>
    <main>
        <section>
            <h1>Crie sua conta</h1>
            <p>Seu próximo grande evento começa aqui!</p>
            <form id="register-form" class="form-guestly">
                <div class="form-field">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Nome">
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@gmail.com">
                </div>
                <div class="form-field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password">
                </div>
                <button type="submit">Cadastrar</button>
            </form>
            <p class="link-login">Já tem uma conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>
</body>
</html>
